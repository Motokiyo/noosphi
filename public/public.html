<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Noosfeerique · Public</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <style>
    /* Page des spectateurs pendant une session collective.
       Noir pur (un ecran OLED n'allume pas ses pixels noirs : peu de batterie,
       pas de lumiere dans la salle), aucune 3D, aucun son. */
    :root {
      --bg: #000;
      --glow: 201, 162, 77;              /* or de la charte */
      --text: rgba(255, 255, 255, 0.35);
      --text-strong: rgba(255, 255, 255, 0.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body {
      color: var(--text);
      font: 300 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .glow {
      position: absolute; top: 50%; left: 50%;
      width: 42vmin; height: 42vmin; margin: -21vmin 0 0 -21vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--glow), .10) 0%, rgba(var(--glow), .03) 45%, transparent 70%);
      opacity: 0; transition: opacity 2s ease;
    }
    body.connected .glow { opacity: 1; animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.06); } }
    .panel { position: relative; width: min(320px, calc(100% - 32px)); text-align: center; }
    .panel h1 { font-size: 15px; font-weight: 400; letter-spacing: .12em; color: var(--text-strong); margin-bottom: 16px; }
    .panel p { margin-bottom: 16px; }
    .panel input {
      width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15); background: transparent;
      color: var(--text-strong); font: inherit; text-align: center; letter-spacing: .1em; text-transform: uppercase;
    }
    .panel button {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(var(--glow), .5);
      background: transparent; color: rgba(var(--glow), .9); font: inherit; cursor: pointer;
    }
    .status { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 16px; right: 16px;
      text-align: center; font-size: 12px; transition: opacity 3s ease; }
    .status.faded { opacity: .25; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="panel" id="join">
    <h1>NOOSFEERIQUE</h1>
    <p>Entrez le code de la séance</p>
    <input id="code" type="text" maxlength="9" placeholder="NOOS-ABCD" autocomplete="off" autocapitalize="characters">
    <button id="btn-join" type="button">Rejoindre</button>
  </div>

  <div class="status" id="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/public.js"></script>
</body>
</html>
